<script>
const scene=document.getElementById('scene'),camera=document.getElementById('camera'),paper=document.getElementById('paper'),hint=document.getElementById('hint'),status=document.getElementById('status'),input=document.getElementById('photo-file'),portrait=document.getElementById('portrait');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let state='ready',photoURL;
const accessories=document.getElementById('accessories');
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}fit();addEventListener('resize',fit);
camera.addEventListener('click',()=>{
 if(state!=='ready')return;state='printing';camera.disabled=true;scene.classList.add('printing');status.textContent='照片正在出来……';
 setTimeout(()=>{scene.classList.add('landed');hint.textContent='照片出来了，点一下看看。';
  setTimeout(()=>{state='printed';paper.disabled=false;status.textContent='轻轻点一下相纸。';paper.focus({preventScroll:true})},reduced?0:1500);
 },reduced?0:2100);
});
paper.addEventListener('click',()=>{
 if(state==='printed'){state='developing';paper.disabled=true;scene.classList.add('developed');hint.textContent='这一格，留给你。';status.textContent='';
  setTimeout(()=>{state='developed';paper.disabled=false;paper.setAttribute('aria-label','更换拍立得照片');hint.textContent='把帽子和墨镜，拖到照片上。';accessories.hidden=false;status.textContent='拖动配饰，还能调整戴上的位置。';document.dispatchEvent(new Event('scene:complete'));},reduced?0:2600);
 }else if(state==='developed'){input.click()}
});
input.addEventListener('change',()=>{
 const file=input.files[0];if(!file)return;if(!file.type.startsWith('image/')){status.textContent='请选择图片文件。';return}
 const next=URL.createObjectURL(file);
 portrait.onload=()=>{if(photoURL)URL.revokeObjectURL(photoURL);photoURL=next;scene.classList.add('has-photo');hint.textContent='生日快乐，piu。';status.textContent='点击照片可更换 · 点击小配饰可试戴';};
 portrait.onerror=()=>{URL.revokeObjectURL(next);status.textContent='图片未能读取，请换一张。'};portrait.src=next;
});
</script>

 let selectedHat='',selectedGlasses='',drag=null,suppressClick=null;
 const defaults={hat:{x:48.7,y:-10.4},glasses:{x:27.8,y:43.6}},positions=structuredClone(defaults);
 function render(){
  scene.classList.toggle('wearing-hat',Boolean(selectedHat));scene.classList.toggle('wearing-glasses',Boolean(selectedGlasses));
  if(selectedHat){hat.src=hats[selectedHat];hat.alt=selectedHat==='blue'?'蓝白生日帽':'绿色生日帽'}
  if(selectedGlasses){glasses.src=lenses[selectedGlasses];glasses.alt=selectedGlasses==='pixel'?'黑色像素墨镜':'紫色墨镜';}
  for(const [kind,node] of [['hat',hat],['glasses',glasses]]){node.style.left=positions[kind].x+'%';node.style.top=positions[kind].y+'%';}
  buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hat===selectedHat)));glassesButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.glasses===selectedGlasses)));
 }
 function select(kind,value){if(kind==='hat')selectedHat=selectedHat===value?'':value;else selectedGlasses=selectedGlasses===value?'':value;render();status.textContent='拖住照片上的配饰，可以调整位置。';}
 function localPoint(x,y){
  const r=paper.getBoundingClientRect(),angle=6*Math.PI/180,dx=x-r.left-r.width/2,dy=y-r.top-r.height/2;
  return {x:(dx*Math.cos(angle)-dy*Math.sin(angle)+paper.clientWidth/2),y:(dx*Math.sin(angle)+dy*Math.cos(angle)+paper.clientHeight/2)};
 }
 function bind(node,kind,value,placed=false){
  node.addEventListener('pointerdown',e=>{
   if(e.button!==0||paper.disabled)return;
   e.stopPropagation();drag={node,kind,value,id:e.pointerId,x:e.clientX,y:e.clientY,placed,moved:false};node.setPointerCapture(e.pointerId);
  });
  node.addEventListener('pointermove',e=>{
   if(!drag||drag.node!==node||drag.id!==e.pointerId)return;
   if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;
   e.preventDefault();drag.moved=true;
   if(!drag.ghost){
    const ghost=document.createElement('img');ghost.src=kind==='hat'?hats[value||selectedHat]:lenses[value||selectedGlasses];ghost.className='accessory-drag-ghost';ghost.alt='';
    ghost.style.width=paper.clientWidth*(kind==='hat'?.309:.435)+'px';document.body.append(ghost);drag.ghost=ghost;paper.classList.add('drop-target');
   }
   drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  });
  function finish(e,cancelled=false){
   if(!drag||drag.node!==node||drag.id!==e.pointerId)return;
   const active=drag;drag=null;
   if(active.moved){
    suppressClick=node;setTimeout(()=>{if(suppressClick===node)suppressClick=null},400);
    if(!cancelled){
     const point=localPoint(e.clientX,e.clientY);
     if(point.x>-50&&point.x<paper.clientWidth+50&&point.y>-100&&point.y<paper.clientHeight+50){
      const element=kind==='hat'?hat:glasses;
      if(kind==='hat'){selectedHat=value||selectedHat;hat.src=hats[selectedHat]}else selectedGlasses=value||selectedGlasses;
      const width=paper.clientWidth*(kind==='hat'?.309:.435),ratio=(active.ghost.naturalHeight||element.naturalHeight)/(active.ghost.naturalWidth||element.naturalWidth);
      positions[kind]={x:(point.x-width/2)/paper.clientWidth*100,y:(point.y-width*ratio/2)/paper.clientHeight*100};
      render();status.textContent='位置调整好了，还可以继续拖动。';
     }
    }
   }
   active.ghost?.remove();paper.classList.remove('drop-target');if(node.hasPointerCapture(e.pointerId))node.releasePointerCapture(e.pointerId);
  }
  node.addEventListener('pointerup',e=>finish(e));node.addEventListener('pointercancel',e=>finish(e,true));node.addEventListener('lostpointercapture',e=>finish(e,true));

 render();

 addEventListener('message',async event=>{
  if(event.source!==parent||event.origin!==location.origin)return;
  if(camera&&event.data?.type==='journey:depart'){
   if(leaving)return;leaving=true;const token=++generation;
   const scene=document.getElementById('scene'),portrait=document.getElementById('portrait'),data={};
   if(portrait.src.startsWith('blob:'))data.customPhoto=portrait.src;
   for(const kind of ['hat','glasses'])if(scene.classList.contains('wearing-'+kind)){
    const item=document.getElementById('worn-'+kind);data[kind]={src:item.getAttribute('src'),left:item.style.left,top:item.style.top};
   }
   person=makePerson(data);person.classList.add('preparing');document.getElementById('paper').append(person);
   await Promise.all([...person.querySelectorAll('img')].map(img=>img.decode().catch(()=>{})));
   if(token!==generation)return;
   try{traceOutline(person);}catch{/* A user image must never block the next scene. */}
   person.classList.remove('preparing');scene.classList.add('person-tracing');document.getElementById('paper').disabled=true;
   if(!reduced)await new Promise(resolve=>setTimeout(resolve,1100));
   if(token!==generation)return;
   scene.classList.add('person-exit');
   setTimeout(()=>{if(token===generation)parent.postMessage({channel:'birthday-journey',type:'departed',person:data},location.origin)},reduced?0:900);
  }else if(camera&&event.data?.type==='journey:activate'){
   generation++;leaving=false;person?.remove();document.getElementById('scene').classList.remove('person-exit','person-tracing');
   if(document.getElementById('scene').classList.contains('developed'))document.getElementById('paper').disabled=false;
  }else if(!camera&&event.data?.type==='journey:person'){
   person?.remove();person=makePerson(event.data.person||{});document.querySelector('.stage').append(person);
  }

 const copy=new Map(Object.entries(window.BIRTHDAY_THAI||{}).map(([k,v])=>[normalize(k),v]));
 function translation(text){
  const key=normalize(text);if(copy.has(key))return copy.get(key);
  let m;
  if((m=key.match(/^第([123])格·放入照片$/)))return `ช่องที่ ${m[1]} · เพิ่มรูป`;
  if((m=key.match(/^已放入([123])张照片·点击可更换$/)))return `เพิ่มรูปแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已经放入([123])张见面照片·点击相纸可更换$/)))return `เพิ่มรูปที่ได้เจอกันแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已刮开([0-3])\/3栏$/)))return `ขูดแล้ว ${m[1]} / 3 ช่อง`;
  if((m=key.match(/^([123])个爱心停好了。$/)))return `หัวใจหยุดแล้ว ${m[1]} ดวง`;
  if((m=key.match(/^已贴好([1-4])片，继续拼下一片。$/)))return `ติดแล้ว ${m[1]} ชิ้น ต่อชิ้นถัดไปได้เลย`;
  if((m=key.match(/^刮开第([123])栏$/)))return `ขูดช่องที่ ${m[1]}`;
  if((m=key.match(/^第([123])栏已刮开$/)))return `ขูดช่องที่ ${m[1]} แล้ว`;
  if((m=key.match(/^为第([123])格选择照片$/)))return `เลือกรูปสำหรับช่องที่ ${m[1]}`;
  if((m=key.match(/^为曼谷回忆选择第([123])张照片$/)))return `เลือกรูปความทรงจำกรุงเทพฯ ใบที่ ${m[1]}`;
  if((m=key.match(/^拼上第[一二三四五]层[紫红黄绿粉]色祝福纸条$/)))return 'ต่อกระดาษคำอวยพรชั้นนี้';
  return null;
 }
 const ignored='script,style,noscript,textarea,option,title,svg,.bi-zh,.bi-th,[data-no-translate]';
 function spans(text,thai){const zh=document.createElement('span'),th=document.createElement('span');zh.className='bi-zh';zh.lang='zh-CN';zh.textContent=text;th.className='bi-th';th.lang='th';th.textContent=thai;return [zh,th];}
 function translateElement(el){
  for(const attr of ['aria-label','title']){const value=el.getAttribute(attr);if(value&&!/[\u0e00-\u0e7f]/.test(value)){const thai=translation(value);if(thai)el.setAttribute(attr,value+' · '+thai);}}
  if(el.closest(ignored))return;
  // Only group text and line breaks: keep controls, images and event handlers intact.
  if(el.childNodes.length&&[...el.childNodes].every(n=>n.nodeType===3||n.nodeName==='BR')){
   const text=el.textContent,thai=cn.test(text)&&translation(text);
   if(thai){const pair=spans(text,thai);pair[0].replaceChildren(...el.childNodes);el.classList.add('bi');el.replaceChildren(...pair);return;}
  }
  for(const node of [...el.childNodes]){
   if(node.nodeType!==3||!cn.test(node.textContent))continue;
   const thai=translation(node.textContent);if(!thai)continue;
   const pair=document.createElement('span');pair.className='bi bi-inline';pair.append(...spans(node.textContent,thai));node.replaceWith(pair);
  }
 }
 function scan(root){
  if(!root)return;
  if(root.nodeType===3){root=root.parentElement;}
  if(!root||root.nodeType!==1||root.closest(ignored))return;
  // Work from leaves upward so unrelated text never becomes one translation.
  [...root.querySelectorAll('*')].reverse().forEach(translateElement);translateElement(root);
 }
 scan(document.body);
 const observer=new MutationObserver(records=>{
  const roots=new Set();for(const r of records){if(r.type==='attributes')roots.add(r.target);else if(r.type==='characterData')roots.add(r.target.parentElement);else {roots.add(r.target);}}
  observer.disconnect();for(const root of roots)scan(root);observe();
 });
 function observe(){if(!document.body)return;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title']});}observe();
 // SVG labels need SVG text rather than HTML spans, and their own clear second line.
 for(const el of document.querySelectorAll('svg text')){
  const thai=translation(el.textContent);if(!thai)continue;
  const line=document.createElementNS('http://www.w3.org/2000/svg','tspan');line.setAttribute('x',el.getAttribute('x')||'0');line.setAttribute('dy','13');line.setAttribute('class','svg-th');line.setAttribute('lang','th');line.textContent=thai;el.append(line);
 }
 document.documentElement.classList.add('bilingual');
})();
</script></body></html>
