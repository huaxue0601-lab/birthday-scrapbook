<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把祝福拼成蛋糕 · piu</title><link rel="stylesheet" href="wish-preview.css?v=0ebb5534bc02"><link rel="stylesheet" href="cursors.css?v=0ebb5534bc02"><link rel="stylesheet" href="bilingual.css?v=0ebb5534bc02"></head>
<body><main id="wish-scene" class="wish-scene" aria-label="手撕纸生日蛋糕">
 <div class="paper-grain" aria-hidden="true"></div>
 <header><p class="eyebrow">FOR MY BABY · 26</p><h1 id="heading">把想对你说的话，<br>叠成一个生日蛋糕。</h1></header>
 <svg class="bunting" viewBox="0 0 240 55" aria-hidden="true"><path d="M0 3Q120 40 240 3" fill="none" stroke="#a99a82"/><path d="M15 7L35 12L22 32Z" fill="#af7064"/><path d="M57 17L77 21L65 42Z" fill="#c5ae70"/><path d="M101 24L121 25L110 48Z" fill="#8fa493"/><path d="M145 23L165 20L160 44Z" fill="#c7a2a0"/><path d="M190 14L210 10L205 34Z" fill="#d2bc86"/></svg>
 <div id="arena" class="arena">
  <div id="guide" class="drop-guide" aria-hidden="true"></div>
  <div class="cake-doodles" aria-hidden="true"><span>✧</span><span>✳</span><span>✧</span><span>·</span><span>✧</span><span>·</span></div>
  <p class="plate-caption" id="plate-caption">一层一层，都是给你的。</p>
  <button class="note" data-note="0" aria-label="拼上第一层紫色祝福纸条"><img src="asset-note-cake-wish-purple.webp" alt="" draggable="false"><span>26岁的你，<br>要平安，也要快乐。</span></button>
  <button class="note" data-note="1" aria-label="拼上第二层红色祝福纸条" hidden><img src="asset-note-cake-wish-red.webp" alt="" draggable="false"><span>愿你被爱包围，<br>也永远自由地做自己。</span></button>
  <button class="note" data-note="2" aria-label="拼上第三层黄色祝福纸条" hidden><img src="asset-note-cake-wish-yellow.webp" alt="" draggable="false"><span>想做的事，<br>都慢慢实现。</span></button>
  <button class="note" data-note="3" aria-label="拼上第四层绿色祝福纸条" hidden><img src="asset-note-cake-wish-green.webp" alt="" draggable="false"><span>以后的生日，<br>也想陪你过。</span></button>
  <button class="note" data-note="4" aria-label="拼上第五层粉色祝福纸条" hidden><img src="asset-note-cake-wish-pink.webp" alt="" draggable="false"><span>生日快乐 ♡</span></button>
  <button id="candle" class="candle" aria-label="点亮生日蜡烛" hidden><span class="candle-glow" aria-hidden="true"></span><img class="flame" src="asset-note-cake-wish-flame.png" alt="" draggable="false"><img class="wax" src="asset-note-cake-wish-candle.png" alt="" draggable="false"><span class="smoke" aria-hidden="true"></span></button>
  <button id="match" class="matchstick" aria-label="把火柴拖到烛芯，也可以点击点亮" hidden><svg viewBox="0 0 130 55" aria-hidden="true"><path d="M21 26L116 39" stroke="#9b7448" stroke-width="7" stroke-linecap="round"/><path d="M22 24L116 37" stroke="#e6c78b" stroke-width="4" stroke-linecap="round"/><ellipse cx="20" cy="25" rx="10" ry="7" fill="#ad594d"/><path class="match-flame" d="M20 28C-1 17 19 8 20 0C23 9 36 17 20 28Z" fill="#f7b754"/></svg></button>
  <p id="match-hint" class="match-hint" hidden>把火柴拖到烛芯，点亮愿望。</p>
  <div class="tray-copy"><p id="step">第一片 · 给26岁的你</p><p id="instruction">把纸条拖到左边的虚线处<br><span>也可以轻点纸条</span></p></div>
 </div>
 <div class="night-shade" aria-hidden="true"></div>
 <div class="wish-copy"><p id="wish-line">闭上眼睛，<br>许一个只属于你的愿望。</p><span id="wish-small">不用告诉我，愿它悄悄实现。</span></div>
 <footer class="actions"><button id="place">帮我贴上这一片 ↗</button><button id="light" hidden>点亮蜡烛 ✧</button><button id="blow" hidden>许好了，吹灭蜡烛</button><button id="replay" hidden>再许一次愿 ↻</button></footer>
 <p id="status" class="sr-only" role="status" aria-live="polite">把第一片祝福纸条拖到虚线处，也可以点击拼上。</p>
</main><script src="wish-preview.js?v=0ebb5534bc02"></script><script src="journey-bridge.js?v=0ebb5534bc02"></script><script src="bilingual-copy.js?v=0ebb5534bc02"></script><script src="bilingual.js?v=0ebb5534bc02"></script></body></html>
