<script>
const cake=document.getElementById('cake'),left=document.getElementById('left-cup'),right=document.getElementById('right-cup'),particles=document.getElementById('particles'),splashLayer=document.getElementById('splash'),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let started=false,busy=false,repeat=0,cleanup;
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/(innerWidth<=700&&innerHeight>innerWidth?800:1600),innerHeight/(innerWidth<=700&&innerHeight>innerWidth?1100:900)))}fit();addEventListener('resize',fit);
function splash(){
 splashLayer.replaceChildren();if(reduced)return;
 let seed=1220+repeat;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 for(let i=0;i<20;i++){
  const dot=document.createElement('i');dot.className='droplet';const foam=i<12,size=foam?6+random()*6:4+random()*3;
  const vx=(random()-.5)*310,vy=-240-random()*115,duration=1050+random()*220;
  dot.style.width=`${size}px`;dot.style.height=`${foam?size*.8:size*1.3}px`;dot.style.background=foam?'#fff6df':'#d8a95c';splashLayer.append(dot);
  const frames=[];for(let j=0;j<=8;j++){
   const t=j/8,seconds=t*duration/1000,x=vx*seconds,y=vy*seconds+300*seconds*seconds;
   frames.push({transform:`translate(${x}px,${y}px) rotate(${t*140}deg) scale(${1-t*.35})`,opacity:j===0?0:t<.6?.9:Math.max(0,(1-t)*2.25),offset:t});
  }
  dot.animate(frames,{duration,delay:random()*65,easing:'linear',fill:'forwards'}).finished.then(()=>dot.remove()).catch(()=>dot.remove());
 }
}
function burst(){
 clearTimeout(cleanup);particles.replaceChildren();if(reduced)return;
 let seed=26+repeat;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 for(let i=0;i<68;i++){
  const dot=document.createElement('i');dot.className='spark';const angle=random()*Math.PI*2,radius=40+random()*290,size=4+random()*16;
  dot.style.cssText=`left:${680+Math.cos(angle)*radius}px;top:${470+Math.sin(angle)*radius*.6}px;width:${size}px;height:${size}px;--dx:${(random()-.5)*140}px;--dy:${-55-random()*120}px;--alpha:${.3+random()*.5};--delay:${random()*.35}s`;
  particles.append(dot);
 }
 for(let i=0;i<42;i++){
  const t=i/42*Math.PI*2,x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),dot=document.createElement('i');dot.className='spark';
  dot.style.cssText=`left:${1320+x*5}px;top:${300-y*5}px;width:5px;height:5px;background:#dfa7b6;--dx:${x*2}px;--dy:${-y*2}px;--alpha:.75;--delay:${i*.007}s`;particles.append(dot);
 }
 cleanup=setTimeout(()=>particles.replaceChildren(),3200);
}
async function clink(){
 if(busy)return;busy=true;right.disabled=true;document.body.classList.remove('ready');status.textContent='干杯！';
 const duration=reduced?1:repeat?1600:1200;
 const leftFrames=repeat?[{transform:left.style.transform},{transform:'translate(0,0)',offset:.25}]:[{transform:'translate(0,0)'}];
 const rightFrames=repeat?[{transform:right.style.transform},{transform:'translate(0,0)',offset:.25}]:[{transform:'translate(0,0)'}];
 leftFrames.push({transform:'translate(55px,-3px)',offset:.68},{transform:'translate(45px,0)'});
 rightFrames.push({transform:'translate(-272px,0)',offset:.68},{transform:'translate(-262px,5px)'});
 const a=left.animate(leftFrames,{duration,easing:'ease-in-out',fill:'forwards'});
 const b=right.animate(rightFrames,{duration,easing:'ease-in-out',fill:'forwards'});
 setTimeout(()=>{document.body.classList.add('cheers');burst();splash()},reduced?0:duration*.68);
 await Promise.all([a.finished,b.finished]);a.commitStyles();b.commitStyles();a.cancel();b.cancel();
 busy=false;repeat++;right.disabled=false;document.body.classList.add('ready');status.textContent='生日快乐，piu。点击右边的杯子可以再碰一次。';
 document.dispatchEvent(new Event('scene:complete'));
}
cake.addEventListener('click',()=>{
 if(started)return;started=true;cake.disabled=true;document.body.classList.add('dark');status.textContent='灯光暗下，准备碰杯。';
 setTimeout(()=>{document.body.classList.add('cups-visible');clink()},reduced?0:850);
});
right.addEventListener('click',clink);

<script>(() => {
 const camera=document.body.dataset.scene==='camera',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let leaving=false,person,generation=0;
 function makePerson(data){
  const group=document.createElement('div');group.className='birthday-person';
  const head=new Image();head.src=data.customPhoto||'asset-childhood-photo-camera-head.webp?v=5eaffeddb8';head.className=data.customPhoto?'person-photo':'person-head';head.alt='piu 的生日照片';group.append(head);
  for(const kind of ['hat','glasses']){
   const item=data[kind];if(!item)continue;const img=new Image();img.src=item.src;img.alt='';img.className='person-'+kind;img.style.left=item.left;img.style.top=item.top;group.append(img);
  }
  return group;
 }

 // Trace the actual composed alpha silhouette, including the chosen hat and glasses.
 // A small canvas keeps the one-off contour calculation light on phones.
 function traceOutline(group){
  const w=280,h=Math.round(w*group.clientHeight/group.clientWidth),scale=w/group.clientWidth;
  const pad=70,cw=w+pad*2,ch=h+pad*2,canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.translate(pad,pad);
  for(const img of group.querySelectorAll('img')){
   if(!img.naturalWidth)continue;
   let x=img.offsetLeft*scale,y=img.offsetTop*scale,iw=img.offsetWidth*scale,ih=img.offsetHeight*scale;
   ctx.save();
   if(img.classList.contains('person-hat')){ctx.translate(x+iw/2,y+ih/2);ctx.rotate(18*Math.PI/180);ctx.translate(-x-iw/2,-y-ih/2);}
   const mode=getComputedStyle(img).objectFit;
   if(mode==='contain'||mode==='cover'){
    if(mode==='cover'){ctx.beginPath();ctx.rect(x,y,iw,ih);ctx.clip();}
    const ratio=(mode==='cover'?Math.max:Math.min)(iw/img.naturalWidth,ih/img.naturalHeight),dw=img.naturalWidth*ratio,dh=img.naturalHeight*ratio;
    ctx.drawImage(img,x+(iw-dw)/2,y+(ih-dh)/2,dw,dh);
   }else ctx.drawImage(img,x,y,iw,ih);
   ctx.restore();
  }
  const pixels=ctx.getImageData(0,0,cw,ch).data,edges=new Map();
  const solid=(x,y)=>x>=0&&y>=0&&x<cw&&y<ch&&pixels[(y*cw+x)*4+3]>35;
  const edge=(x1,y1,x2,y2)=>{const key=y1*(cw+1)+x1;if(!edges.has(key))edges.set(key,[]);edges.get(key).push(y2*(cw+1)+x2);};
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)if(solid(x,y)){
   if(!solid(x,y-1))edge(x,y,x+1,y);
   if(!solid(x+1,y))edge(x+1,y,x+1,y+1);
   if(!solid(x,y+1))edge(x+1,y+1,x,y+1);
   if(!solid(x-1,y))edge(x,y+1,x,y);
  }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${cw} ${ch}`);svg.setAttribute('aria-hidden','true');svg.classList.add('person-outline');svg.style.cssText=`left:${-pad/scale}px;top:${-pad/scale}px;width:${cw/scale}px;height:${ch/scale}px`; 
  while(edges.size){
   const first=edges.keys().next().value;let key=first;const points=[];
   do{points.push([key%(cw+1),Math.floor(key/(cw+1))]);const next=edges.get(key);if(!next)break;const end=next.pop();if(!next.length)edges.delete(key);key=end;}while(key!==first);
   if(points.length<70)continue;

 const copy=new Map(Object.entries(window.BIRTHDAY_THAI||{}).map(([k,v])=>[normalize(k),v]));
 function translation(text){
  const key=normalize(text);if(copy.has(key))return copy.get(key);
  let m;
  if((m=key.match(/^第([123])格·放入照片$/)))return `ช่องที่ ${m[1]} · เพิ่มรูป`;
  if((m=key.match(/^已放入([123])张照片·点击可更换$/)))return `เพิ่มรูปแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已经放入([123])张见面照片·点击相纸可更换$/)))return `เพิ่มรูปที่ได้เจอกันแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已刮开([0-3])\/3栏$/)))return `ขูดแล้ว ${m[1]} / 3 ช่อง`;
  if((m=key.match(/^([123])个爱心停好了。$/)))return `หัวใจหยุดแล้ว ${m[1]} ดวง`;
  if((m=key.match(/^已贴好([1-4])片，继续拼下一片。$/)))return `ติดแล้ว ${m[1]} ชิ้น ต่อชิ้นถัดไปได้เลย`;
  if((m=key.match(/^刮开第([123])栏$/)))return `ขูดช่องที่ ${m[1]}`;
  if((m=key.match(/^第([123])栏已刮开$/)))return `ขูดช่องที่ ${m[1]} แล้ว`;
  if((m=key.match(/^为第([123])格选择照片$/)))return `เลือกรูปสำหรับช่องที่ ${m[1]}`;
  if((m=key.match(/^为曼谷回忆选择第([123])张照片$/)))return `เลือกรูปความทรงจำกรุงเทพฯ ใบที่ ${m[1]}`;
  if((m=key.match(/^拼上第[一二三四五]层[紫红黄绿粉]色祝福纸条$/)))return 'ต่อกระดาษคำอวยพรชั้นนี้';
  return null;
 }
 const ignored='script,style,noscript,textarea,option,title,svg,.bi-zh,.bi-th,[data-no-translate]';
 function spans(text,thai){const zh=document.createElement('span'),th=document.createElement('span');zh.className='bi-zh';zh.lang='zh-CN';zh.textContent=text;th.className='bi-th';th.lang='th';th.textContent=thai;return [zh,th];}
 function translateElement(el){
  for(const attr of ['aria-label','title']){const value=el.getAttribute(attr);if(value&&!/[\u0e00-\u0e7f]/.test(value)){const thai=translation(value);if(thai)el.setAttribute(attr,value+' · '+thai);}}
  if(el.closest(ignored))return;
  // Only group text and line breaks: keep controls, images and event handlers intact.
  if(el.childNodes.length&&[...el.childNodes].every(n=>n.nodeType===3||n.nodeName==='BR')){
   const text=el.textContent,thai=cn.test(text)&&translation(text);
   if(thai){const pair=spans(text,thai);pair[0].replaceChildren(...el.childNodes);el.classList.add('bi');el.replaceChildren(...pair);return;}
  }
  for(const node of [...el.childNodes]){
   if(node.nodeType!==3||!cn.test(node.textContent))continue;
   const thai=translation(node.textContent);if(!thai)continue;
   const pair=document.createElement('span');pair.className='bi bi-inline';pair.append(...spans(node.textContent,thai));node.replaceWith(pair);
  }
 }
 function scan(root){
  if(!root)return;
  if(root.nodeType===3){root=root.parentElement;}
  if(!root||root.nodeType!==1||root.closest(ignored))return;
  // Work from leaves upward so unrelated text never becomes one translation.
  [...root.querySelectorAll('*')].reverse().forEach(translateElement);translateElement(root);
 }
 scan(document.body);
 const observer=new MutationObserver(records=>{
  const roots=new Set();for(const r of records){if(r.type==='attributes')roots.add(r.target);else if(r.type==='characterData')roots.add(r.target.parentElement);else {roots.add(r.target);}}
  observer.disconnect();for(const root of roots)scan(root);observe();
 });
 function observe(){if(!document.body)return;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title']});}observe();
 // SVG labels need SVG text rather than HTML spans, and their own clear second line.
 for(const el of document.querySelectorAll('svg text')){
  const thai=translation(el.textContent);if(!thai)continue;
  const line=document.createElementNS('http://www.w3.org/2000/svg','tspan');line.setAttribute('x',el.getAttribute('x')||'0');line.setAttribute('dy','13');line.setAttribute('class','svg-th');line.setAttribute('lang','th');line.textContent=thai;el.append(line);
 }
 document.documentElement.classList.add('bilingual');
})();
</script></body></html>
