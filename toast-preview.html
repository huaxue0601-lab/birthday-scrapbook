<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>piu · 关灯碰杯小样</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#eee8dc url('asset-envelope-background-paper.jpg') center/cover;color:#443c32}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}
.cake{position:absolute;left:300px;top:350px;width:520px;height:506.34px;cursor:pointer;border:0;padding:0;background:none;filter:drop-shadow(2px 4px 2px #574d3720)}
.cake img{display:block;width:100%;height:100%;pointer-events:none}
button:focus-visible{outline:2px dashed #ac9780;outline-offset:10px}.cake:disabled{cursor:default}
.hint{position:absolute;left:810px;top:80px;margin:0;font:22px 'Kaiti SC','STKaiti',KaiTi,serif;letter-spacing:3px;transform:rotate(-2deg);transition:opacity .5s}
.dark .hint{opacity:0}
.shade{position:absolute;inset:0;background:#302936;opacity:0;transition:opacity 1.15s ease;pointer-events:none}
.dark .shade{opacity:.82}
.celebration{pointer-events:none}
.cup{position:absolute;border:0;padding:0;background:none;opacity:0;transition:opacity .7s;filter:drop-shadow(1px 2px 2px #19141a26)}
.cup img{display:block;width:100%;height:auto;pointer-events:none}
.cup-left{left:460px;top:480px;width:180px;transform-origin:50% 90%}
.cup-right{left:950px;top:450px;width:445px;transform-origin:20% 90%;cursor:pointer}
.cups-visible .cup{opacity:1}.ready .cup-right{pointer-events:auto}
.greeting{position:absolute;left:980px;top:212px;color:#f6f0df;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
.greeting p{margin:0 0 32px;font:46px Georgia,'Times New Roman',serif;letter-spacing:-1px}
.greeting span{display:block;margin-left:44px;font:35px 'Kaiti SC','STKaiti',KaiTi,serif;letter-spacing:6px;transform:rotate(-4deg)}
.cheers .greeting{opacity:1;transform:translateY(0)}
.particles{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;border-radius:50%;background:#f8f1df;opacity:0;animation:spark 2.5s ease-out forwards;animation-delay:var(--delay)}
.splash{position:absolute;inset:0;pointer-events:none}.droplet{position:absolute;left:692px;top:523px;border-radius:50%;opacity:0;will-change:transform,opacity;box-shadow:inset 1px 1px 0 #fff9}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:var(--alpha)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.caption{position:absolute;left:110px;bottom:50px;margin:0;font:13px 'Kaiti SC','STKaiti',KaiTi,serif;letter-spacing:1px;background:#f5eddd90;padding:4px 8px;color:#5b4e40}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style><link rel="stylesheet" href="cursors.css?v=f463e920eebc"><link rel="stylesheet" href="responsive.css?v=f463e920eebc"><link rel="stylesheet" href="person-transition.css?v=f463e920eebc"></head>
<body data-scene="toast">
<main aria-label="生日关灯碰杯互动小样">
 <div class="stage"><p class="hint">点一下，关灯</p><button class="cake" id="cake" aria-label="点击生日蛋糕，关灯碰杯"><img src="asset-letter-cake-cake-transparent.png" alt="写着彩色 HAPPY BIRTHDAY 字母的奶油蛋糕"></button></div>
 <div class="shade" aria-hidden="true"></div>
 <div class="stage celebration">
  <div class="greeting"><p>HBD to my baby</p><span>干杯！</span></div>
  <div class="cup cup-left" id="left-cup"><img src="asset-toast-cups-cup-left-transparent.png" alt="装有金色啤酒和白泡沫的玻璃杯"></div>
  <button class="cup cup-right" id="right-cup" disabled aria-label="再碰一次杯"><img src="asset-toast-cups-cup-right-hand-soft-edge.png" alt="一只手握着倾斜的啤酒杯"></button>
  <div class="particles" id="particles" aria-hidden="true"></div>
  <div class="splash" id="splash" aria-hidden="true"></div>
  <p class="caption" id="caption">愿这一岁，多一点开心。</p>
 </div>
 <p class="sr-only" id="status" aria-live="polite"></p>
</main>
<script>
const cake=document.getElementById('cake'),left=document.getElementById('left-cup'),right=document.getElementById('right-cup'),particles=document.getElementById('particles'),splashLayer=document.getElementById('splash'),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let started=false,busy=false,repeat=0,cleanup;
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/(innerWidth<=700&&innerHeight>innerWidth?800:1600),innerHeight/(innerWidth<=700&&innerHeight>innerWidth?1100:900)))}fit();addEventListener('resize',fit);
function splash(){
 splashLayer.replaceChildren();if(reduced)return;
 let seed=1220+repeat;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 for(let i=0;i<20;i++){
  const dot=document.createElement('i');dot.className='droplet';const foam=i<12,size=foam?6+random()*6:4+random()*3;
  const vx=(random()-.5)*310,vy=-240-random()*115,duration=1050+random()*220;
  dot.style.width=`${size}px`;dot.style.height=`${foam?size*.8:size*1.3}px`;dot.style.background=foam?'#fff6df':'#d8a95c';splashLayer.append(dot);
  const frames=[];for(let j=0;j<=8;j++){
   const t=j/8,seconds=t*duration/1000,x=vx*seconds,y=vy*seconds+300*seconds*seconds;
   frames.push({transform:`translate(${x}px,${y}px) rotate(${t*140}deg) scale(${1-t*.35})`,opacity:j===0?0:t<.6?.9:Math.max(0,(1-t)*2.25),offset:t});
  }
  dot.animate(frames,{duration,delay:random()*65,easing:'linear',fill:'forwards'}).finished.then(()=>dot.remove()).catch(()=>dot.remove());
 }
}
function burst(){
 clearTimeout(cleanup);particles.replaceChildren();if(reduced)return;
 let seed=26+repeat;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 for(let i=0;i<68;i++){
  const dot=document.createElement('i');dot.className='spark';const angle=random()*Math.PI*2,radius=40+random()*290,size=4+random()*16;
  dot.style.cssText=`left:${680+Math.cos(angle)*radius}px;top:${470+Math.sin(angle)*radius*.6}px;width:${size}px;height:${size}px;--dx:${(random()-.5)*140}px;--dy:${-55-random()*120}px;--alpha:${.3+random()*.5};--delay:${random()*.35}s`;
  particles.append(dot);
 }
 for(let i=0;i<42;i++){
  const t=i/42*Math.PI*2,x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),dot=document.createElement('i');dot.className='spark';
  dot.style.cssText=`left:${1320+x*5}px;top:${300-y*5}px;width:5px;height:5px;background:#dfa7b6;--dx:${x*2}px;--dy:${-y*2}px;--alpha:.75;--delay:${i*.007}s`;particles.append(dot);
 }
 cleanup=setTimeout(()=>particles.replaceChildren(),3200);
}
async function clink(){
 if(busy)return;busy=true;right.disabled=true;document.body.classList.remove('ready');status.textContent='干杯！';
 const duration=reduced?1:repeat?1600:1200;
 const leftFrames=repeat?[{transform:left.style.transform},{transform:'translate(0,0)',offset:.25}]:[{transform:'translate(0,0)'}];
 const rightFrames=repeat?[{transform:right.style.transform},{transform:'translate(0,0)',offset:.25}]:[{transform:'translate(0,0)'}];
 leftFrames.push({transform:'translate(55px,-3px)',offset:.68},{transform:'translate(45px,0)'});
 rightFrames.push({transform:'translate(-272px,0)',offset:.68},{transform:'translate(-262px,5px)'});
 const a=left.animate(leftFrames,{duration,easing:'ease-in-out',fill:'forwards'});
 const b=right.animate(rightFrames,{duration,easing:'ease-in-out',fill:'forwards'});
 setTimeout(()=>{document.body.classList.add('cheers');burst();splash()},reduced?0:duration*.68);
 await Promise.all([a.finished,b.finished]);a.commitStyles();b.commitStyles();a.cancel();b.cancel();
 busy=false;repeat++;right.disabled=false;document.body.classList.add('ready');status.textContent='生日快乐，piu。点击右边的杯子可以再碰一次。';
 document.dispatchEvent(new Event('scene:complete'));
}
cake.addEventListener('click',()=>{
 if(started)return;started=true;cake.disabled=true;document.body.classList.add('dark');status.textContent='灯光暗下，准备碰杯。';
 setTimeout(()=>{document.body.classList.add('cups-visible');clink()},reduced?0:850);
});
right.addEventListener('click',clink);
</script>
<script src="person-transition.js?v=f463e920eebc"></script><script src="journey-bridge.js?v=f463e920eebc"></script></body></html>
