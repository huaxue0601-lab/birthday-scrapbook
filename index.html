</style><script>(() => {
 const attempts=new WeakMap(),failed=new Set();let notice;
 function refresh(){
  if(!notice&&failed.size){
   notice=document.createElement('button');notice.type='button';
   notice.innerHTML='图片未加载，点击重试<br><span lang="th">โหลดรูปไม่สำเร็จ แตะเพื่อลองอีกครั้ง</span>';
   notice.style.cssText='position:fixed;z-index:10000;left:50%;bottom:74px;transform:translateX(-50%);width:max-content;max-width:90vw;padding:10px 16px;border:1px dashed #a38e6c;border-radius:10px;background:#fff8ed;color:#695446;font:14px system-ui;box-shadow:0 3px 15px #46341f22';
   notice.addEventListener('click',()=>{for(const img of [...failed]){failed.delete(img);const state=attempts.get(img);if(state){state.count=0;retry(img,state);}}refresh();});
   document.body.append(notice);
  }
  if(notice)notice.hidden=!failed.size;
 }
 function retry(img,state){
  const expected=img.getAttribute('src');state.count++;
  setTimeout(()=>{
   if(!img.isConnected||img.getAttribute('src')!==expected)return;
   const url=new URL(state.original,document.baseURI);url.searchParams.set('asset_retry',state.count+'-'+Date.now());
   state.current=url.href;img.src=state.current;
  },state.count===1?650:1600);
 }
 document.addEventListener('error',event=>{
  const img=event.target;if(img.tagName!=='IMG')return;
  const src=img.getAttribute('src');if(!src||/^(data|blob):/.test(src))return;
  const url=new URL(src,document.baseURI);if(url.origin!==new URL(document.baseURI).origin)return;
  let state=attempts.get(img);
  if(!state||state.current!==url.href){state={original:src,current:url.href,count:0};attempts.set(img,state);}
  if(state.count<2)retry(img,state);else{failed.add(img);refresh();}
 },true);
 document.addEventListener('load',event=>{if(failed.delete(event.target))refresh();},true);
})();
</script></head><body>

}refresh();});\n   document.body.append(notice);\n  }\n  if(notice)notice.hidden=!failed.size;\n }\n function retry(img,state){\n  const expected=img.getAttribute('src');state.count++;\n  setTimeout(()=>{\n   if(!img.isConnected||img.getAttribute('src')!==expected)return;\n   const url=new URL(state.original,document.baseURI);url.searchParams.set('asset_retry',state.count+'-'+Date.now());\n   state.current=url.href;img.src=state.current;\n  },state.count===1?650:1600);\n }\n document.addEventListener('error',event=>{\n  const img=event.target;if(img.tagName!=='IMG')return;\n  const src=img.getAttribute('src');if(!src||/^(data|blob):/.test(src))return;\n  const url=new URL(src,document.baseURI);if(url.origin!==new URL(document.baseURI).origin)return;\n  let state=attempts.get(img);\n  if(!state||state.current!==url.href){state={original:src,current:url.href,count:0};attempts.set(img,state);}\n  if(state.count\u003c2)retry(img,state);else{failed.add(img);refresh();}\n },true);\n document.addEventListener('load',event=>{if(failed.delete(event.target))refresh();},true);\n})();\n\u003c/script>\u003c/head>\u003cbody>\u003cmain class=\"world\" id=\"world\" aria-label=\"生日礼物开场预览\">\u003cdiv class=\"half left\">\u003cdiv class=\"stage\" id=\"art\">\u003cdiv class=\"ticket\">\u003cimg class=\"paper\" src=\"data:image/webp;base64,UklGRibgAABXRUJQVlA4WAoAAAAQAAAA5AEAzwIAQUxQSC8YAAABFLVt2zDy/6c7PUtEKHLbhOkErvwCKyXMZcYTnXFjaM/EH///qrXE//dca+3rossADMSYwELKBFuxE4sGu3vsbh2xRQa7AzEAewaDDnOUAcFAbOm44uy1Xs8/zr4uLjHet+ft/U9ETACBAMX/3QoTIiKwmq44ZKHcu0Ksue7XDr/ZzLsGx2+yEX6z7lf0Wfiz6lBv54vRwH77Xj179tx5p6GH7tSr56+5y9/xx9uiV88G3nmnCx5/8OGGfWDUhAcebvCHHumzU6+eDd1rO/w5d/Wq2zdr2rRp0yat+gwcMGDAwL5PTZ4wceKkCTO4pi6bMGnirzlh0hXHDBzw2xw0dtKEiQ066b1Z/COdNnHSxAaeMGlUv4ED/pT2G9YRWV0efz//zLPOOuvsM1778vN58+bN/YqrbYUp2a/MP2Jr+BQbPsVfM9mvyD/n77dDqANotknHjh07brLeKyxOsf7JuIZa/ONN/AO1FP+Elzi9K0KR9yg+5IcYU0rJKOPEmr7wBfW8mEY1J8ZjnC/rvMP25T273W5JTkz8sSVcQO9kFLbZN63gHNb7jIlmZjRJcUErOADrvsdEWdeVYUSM+gpuFHN9ObfncMa \n function translateElement(el){\n  for(const attr of ['aria-label','title']){const value=el.getAttribute(attr);if(value&&!/[\\u0e00-\\u0e7f]/.test(value)){const thai=translation(value);if(thai)el.setAttribute(attr,value+' · '+thai);}}\n  if(el.closest(ignored))return;\n  // Only group text and line breaks: keep controls, images and event handlers intact.\n  if(el.childNodes.length&&[...el.childNodes].every(n=>n.nodeType===3||n.nodeName==='BR')){\n   const text=el.textContent,thai=cn.test(text)&&translation(text);\n   if(thai){const pair=spans(text,thai);pair[0].replaceChildren(...el.childNodes);el.classList.add('bi');el.replaceChildren(...pair);return;}\n  }\n  for(const node of [...el.childNodes]){\n   if(node.nodeType!==3||!cn.test(node.textContent))continue;\n   const thai=translation(node.textContent);if(!thai)continue;\n   const pair=document.createElement('span');pair.className='bi bi-inline';pair.append(...spans(node.textContent,thai));node.replaceWith(pair);\n  }\n }\n function scan(root){\n  if(!root)return;\n  if(root.nodeType===3){root=root.parentElement;}\n  if(!root||root.nodeType!==1||root.closest(ignored))return;\n  // Work from leaves upward so unrelated text never becomes one translation.\n  [...root.querySelectorAll('*')].reverse().forEach(translateElement);translateElement(root);\n }\n scan(document.body);\n const observer=new MutationObserver(records=>{\n  const roots=new Set();for(const r of records){if(r.type==='attributes')roots.add(r.target);else if(r.type==='characterData')roots.add(r.target.parentElement);else {roots.add(r.target);}}\n  observer.disconnect();for(const root of roots)scan(root);observe();\n });\n function observe(){if(!document.body)return;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title']});}observe();\n // SVG labels need SVG text rather than HTML spans, and their own clear second line.\n for(const el of document.querySelectorAll('svg text')){\n  const thai=translation(el.textContent);if(!thai)continue;\n  const line=document.createElementNS('http://www.w3.org/2000/svg','tspan');line.setAttribute('x',el.getAttribute('x')||'0');line.setAttribute('dy','13');line.setAttribute('class','svg-th');line.setAttribute('lang','th');line.textContent=thai;el.append(line);\n }\n document.documentElement.classList.add('bilingual');\n})();\n\u003c/script>\u003c/body>\u003c/html>\n"</script><script>(() => {
 const scenes=[

  {file:'film-preview.html',title:'我们的胶卷'},

  {file:'childhood-preview.html',title:'小时候的我们',nextLabel:'拼祝福蛋糕 →'},
  {file:'wish-preview.html',title:'把祝福拼成蛋糕'},
  {file:'gift-preview.html',title:'最后的小纸条'}
 ];
 const host=document.getElementById('journey'),previous=document.getElementById('journey-previous'),next=document.getElementById('journey-next'),status=document.getElementById('journey-status'),loading=document.getElementById('journey-loading'),retry=document.getElementById('journey-retry'),loadingCopy=document.getElementById('journey-loading-copy');
 const records=new Map();let current=-1,navigation=0,departing=false,person=null,pendingIndex=null;
 function record(index){
  if(records.has(index))return records.get(index);
  const frame=document.createElement('iframe');frame.className='journey-frame';frame.title=scenes[index].title;frame.hidden=true;frame.inert=true;
  const item={frame,ready:scenes[index].file==='film-preview.html',modal:false,advanced:false};
  item.resourcesLoaded=new Promise(resolve=>frame.addEventListener('load',()=>{item.resolveLoaded();resolve();},{once:true}));
  item.loaded=new Promise(resolve=>{item.resolveLoaded=resolve;});records.set(index,item);const embedded=index===0?document.getElementById('opening-document')?.textContent:null;
  if(embedded){try{frame.srcdoc=JSON.parse(embedded);}catch{frame.src=scenes[index].file+'?v=3a721f493c1c';}}else frame.src=scenes[index].file+'?v=3a721f493c1c';host.append(frame);return item;
 }
 function navigationState(){
  const item=records.get(current);if(!item)return;
  previous.hidden=current<=0||item.modal;next.hidden=!item.ready||current===0||item.modal;
  next.textContent=current===scenes.length-1?'回到开场 ↻':scenes[current].file==='film-preview.html'?'去曼谷见你 →':scenes[current].nextLabel||'继续 →';document.body.classList.toggle('toast-scene',scenes[current].file==='toast-preview.html');
 }
 async function show(index){
  if(index<0||index>=scenes.length)return;
  if(index===0&&records.get(0)?.ready){records.get(0).frame.remove();records.delete(0);}
  const token=++navigation,item=record(index);pendingIndex=index;previous.disabled=next.disabled=true;
  loading.hidden=false;retry.hidden=true;loadingCopy.textContent='正在翻开下一页……';
  // DOM readiness is enough: hidden dialogs may still be downloading large artwork.
  const delayed=setTimeout(()=>{if(token!==navigation)return;loadingCopy.textContent='加载有点慢，请再试一次。';retry.hidden=false;previous.disabled=current<0;},12000);
  await item.loaded;clearTimeout(delayed);if(token!==navigation)return;
  loading.hidden=true;pendingIndex=null;
  for(const [key,other] of records){other.frame.hidden=key!==index;other.frame.inert=key!==index;}
  current=index;previous.disabled=next.disabled=false;navigationState();status.textContent=scenes[index].title;
  if(scenes[index].file==='toast-preview.html'&&person)item.frame.contentWindow.postMessage({type:'journey:person',person},location.origin);
  item.frame.contentWindow.postMessage({type:'journey:activate'},location.origin);
  // Let visible artwork finish before a hidden page competes for bandwidth.
  // Data-saving and slow connections only load the page the visitor requests.
  const connection=typeof navigator==='undefined'?null:navigator.connection;
  if(index+1<scenes.length&&!connection?.saveData&&!/^(slow-)?2g$/.test(connection?.effectiveType||'')){
   item.resourcesLoaded.then(()=>setTimeout(()=>{if(token===navigation&&current===index)record(index+1);},500));
  }
 }
 addEventListener('message',event=>{
  if(event.origin!==location.origin||!event.data||event.data.channel!=='birthday-journey')return;
  const entry=[...records].find(([,item])=>item.frame.contentWindow===event.source);if(!entry)return;

  if(event.data.type==='loaded'){item.resolveLoaded();return;}
  if(event.data.type==='next'){if(index===current&&item.ready&&!item.modal&&pendingIndex===null)show(current+1);return;}

   item.ready=true;
   if(index===0&&current===0&&!item.advanced){item.advanced=true;show(1);return;}
  }else if(event.data.type==='modal')item.modal=Boolean(event.data.open);
  else if(event.data.type==='departed'&&index===current&&departing){departing=false;person=event.data.person;show(current+1);return;}
  if(index===current)navigationState();
 });
 retry.addEventListener('click',()=>{if(pendingIndex===null)return;const index=pendingIndex;records.get(index)?.frame.remove();records.delete(index);show(index);});
 previous.addEventListener('click',()=>show(pendingIndex!==null?current:current-1));
 next.addEventListener('click',()=>{
  if(departing)return;
  if(scenes[current].file==='camera-preview.html'){
   departing=true;previous.disabled=next.disabled=true;
   records.get(current).frame.contentWindow.postMessage({type:'journey:depart'},location.origin);return;

 const cn=/[\u3400-\u9fff]/,normalize=s=>s.replace(/\s+/g,'').trim();
 const copy=new Map(Object.entries(window.BIRTHDAY_THAI||{}).map(([k,v])=>[normalize(k),v]));
 function translation(text){
  const key=normalize(text);if(copy.has(key))return copy.get(key);
  let m;
  if((m=key.match(/^第([123])格·放入照片$/)))return `ช่องที่ ${m[1]} · เพิ่มรูป`;
  if((m=key.match(/^已放入([123])张照片·点击可更换$/)))return `เพิ่มรูปแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已经放入([123])张见面照片·点击相纸可更换$/)))return `เพิ่มรูปที่ได้เจอกันแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已刮开([0-3])\/3栏$/)))return `ขูดแล้ว ${m[1]} / 3 ช่อง`;
  if((m=key.match(/^([123])个爱心停好了。$/)))return `หัวใจหยุดแล้ว ${m[1]} ดวง`;
  if((m=key.match(/^已贴好([1-4])片，继续拼下一片。$/)))return `ติดแล้ว ${m[1]} ชิ้น ต่อชิ้นถัดไปได้เลย`;
  if((m=key.match(/^刮开第([123])栏$/)))return `ขูดช่องที่ ${m[1]}`;
  if((m=key.match(/^第([123])栏已刮开$/)))return `ขูดช่องที่ ${m[1]} แล้ว`;
  if((m=key.match(/^为第([123])格选择照片$/)))return `เลือกรูปสำหรับช่องที่ ${m[1]}`;
  if((m=key.match(/^为曼谷回忆选择第([123])张照片$/)))return `เลือกรูปความทรงจำกรุงเทพฯ ใบที่ ${m[1]}`;
  if((m=key.match(/^拼上第[一二三四五]层[紫红黄绿粉]色祝福纸条$/)))return 'ต่อกระดาษคำอวยพรชั้นนี้';
  return null;

 const ignored='script,style,noscript,textarea,option,title,svg,.bi-zh,.bi-th,[data-no-translate]';
 function spans(text,thai){const zh=document.createElement('span'),th=document.createElement('span');zh.className='bi-zh';zh.lang='zh-CN';zh.textContent=text;th.className='bi-th';th.lang='th';th.textContent=thai;return [zh,th];}
 function translateElement(el){
  for(const attr of ['aria-label','title']){const value=el.getAttribute(attr);if(value&&!/[\u0e00-\u0e7f]/.test(value)){const thai=translation(value);if(thai)el.setAttribute(attr,value+' · '+thai);}}
  if(el.closest(ignored))return;
  // Only group text and line breaks: keep controls, images and event handlers intact.
  if(el.childNodes.length&&[...el.childNodes].every(n=>n.nodeType===3||n.nodeName==='BR')){
   const text=el.textContent,thai=cn.test(text)&&translation(text);
   if(thai){const pair=spans(text,thai);pair[0].replaceChildren(...el.childNodes);el.classList.add('bi');el.replaceChildren(...pair);return;}
  }
  for(const node of [...el.childNodes]){
   if(node.nodeType!==3||!cn.test(node.textContent))continue;
   const thai=translation(node.textContent);if(!thai)continue;
   const pair=document.createElement('span');pair.className='bi bi-inline';pair.append(...spans(node.textContent,thai));node.replaceWith(pair);
  }
 }
 function scan(root){
  if(!root)return;
  if(root.nodeType===3){root=root.parentElement;}
  if(!root||root.nodeType!==1||root.closest(ignored))return;
  // Work from leaves upward so unrelated text never becomes one translation.
  [...root.querySelectorAll('*')].reverse().forEach(translateElement);translateElement(root);
 }
 scan(document.body);
 const observer=new MutationObserver(records=>{
  const roots=new Set();for(const r of records){if(r.type==='attributes')roots.add(r.target);else if(r.type==='characterData')roots.add(r.target.parentElement);else {roots.add(r.target);}}
  observer.disconnect();for(const root of roots)scan(root);observe();
 });
 function observe(){if(!document.body)return;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title']});}observe();
 // SVG labels need SVG text rather than HTML spans, and their own clear second line.
 for(const el of document.querySelectorAll('svg text')){
  const thai=translation(el.textContent);if(!thai)continue;
  const line=document.createElementNS('http://www.w3.org/2000/svg','tspan');line.setAttribute('x',el.getAttribute('x')||'0');line.setAttribute('dy','13');line.setAttribute('class','svg-th');line.setAttribute('lang','th');line.textContent=thai;el.append(line);
 }
 document.documentElement.classList.add('bilingual');
})();
</script></body></html>
