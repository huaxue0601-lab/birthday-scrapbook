ift-scene.revealed .greeting .ding,.gift-scene.revealed .greeting .invitation{display:none}\n .gift-scene.revealed .letter-column{padding-top:10px}\n .gift-scene.revealed .letter-pocket{margin-top:14px}\n .gift-scene .letter{min-height:0;height:170px;aspect-ratio:auto;padding:20px 14px 14px}\n .product-keepsake{gap:8px}\n .product-keepsake .gift-product{height:112px;max-width:86%}\n .product-name{font-size:16px}\n .enlarged-paper .gift-product{height:min(43dvh,300px);width:100%;max-width:100%}\n .enlarged-paper .product-name{font-size:20px}\n .enlarged-paper{min-height:0;padding:30px 18px 22px}\n}\n@media(max-width:700px) and (max-height:600px){\n .gift-scene.revealed .gift-layout{top:22px}\n .gift-scene .letter{height:145px}\n .gift-scene .letter .gift-product{height:90px}\n .gift-scene.revealed .greeting h1{font-size:19px}\n .gift-scene.revealed .greeting h1 .bi-th{font-size:12px!important}\n}\n\u003c/style>\u003cscript>(() => {\n const attempts=new WeakMap(),failed=new Set(),pending=new Map();let notice;\n function refresh(){\n  if(!notice&&failed.size){\n   notice=document.createElement('button');notice.type='button';\n   notice.innerHTML='图片未加载，点击重试\u003cbr>\u003cspan lang=\"th\">โหลดรูปไม่สำเร็จ แตะเพื่อลองอีกครั้ง\u003c/span>';\n   notice.style.cssText='position:fixed;z-index:10000;left:50%;bottom:74px;transform:translateX(-50%);width:max-content;max-width:90vw;padding:10px 16px;border:1px dashed #a38e6c;border-radius:10px;background:#fff8ed;color:#695446;font:14px system-ui;box-shadow:0 3px 15px #46341f22';\n   notice.addEventListener('click',()=>{for(const img of [...failed]){failed.delete(img);pending.delete(img);const state=attempts.get(img);if(state){state.count=0;retry(img,state);}}refresh();});\n   document.body.append(notice);\n  }\n  if(notice)notice.hidden=!failed.size;\n }\n function retry(img,state){\n  const expected=img.getAttribute('src');state.count++;\n  setTimeout(()=>{\n   if(!img.isConnected||img.getAttribute('src')!==expected)return;\n   const url=new URL(state.original,document.baseURI);url.searchParams.set('asset_retry',state.count+'-'+Date.now());\n   state.current=url.href;img.src=state.current;\n  },state.count===1?650:1600);\n }\n document.addEventListener('error',event=>{\n  const img=event.target;if(img.tagName!=='IMG')return;\n  const src=img.getAttribute('src');if(!src||/^(data|blob):/.test(src))return;\n  const url=new URL(src,document.baseURI);if(url.origin!==new URL(document.baseURI).origin)return;\n  let state=attempts.get(img);\n  if(!state||state.current!==url.href){state={original:src,current:url.href,count:0};attempts.set(img,state);}\n  if(state.count\u003c2)retry(img,state);else{failed.add(img);refresh();}\n },true);\n document.addEventListener('load',event=>{pending.delete(event.target);if(failed.delete(event.target))refresh();},true);\n // A stalled mobile request may never fire \"error\". Offer a deliberate retry\n // after 20 seconds, without repeatedly aborting a slow but healthy download.\n function inspect(){\n  const now=Date.now();\n  for(const img of document.querySelectorAll('img')){\n   const src=img.getAttribute('src');\n   if(!src||/^(data|blob):/.test(src)||!img.isConnected||!img.getClientRects().length||img.complete){pending.delete(img);continue;}\n   const url=new URL(src,document.baseURI);if(url.origin!==new URL(document.baseURI).origin)continue;\n   const previous=pending.get(img);\n   if(!previous||previous.src!==src){pending.set(img,{src,since:now});continue;}\n   if(now-previous.since>=20000&&!failed.has(img)){\n    attempts.set(img,{original:src,current:url.href,count:0});failed.add(img);refresh();\n   }\n  }\n  for(const img of [...failed])if(!img.isConnected||img.complete&&img.naturalWidth>0){failed.delete(img);pending.delete(img);refresh();}\n  for(const img of pending.keys())if(!img.isConnected)pending.delete(img);\n }\n document.addEventListener('DOMContentLoaded',()=>{setInterval(inspect,4000);});\n})();\n\u003c/script>\u003c/head>\u003cbody>\u003cmai   const connection=typeof navigator==='undefined'?null:navigator.connection;
  if(index+1<scenes.length&&connection?.effectiveType==='4g'&&!connection.saveData){
   item.resourcesLoaded.then(()=>setTimeout(()=>{if(token===navigation&&current===index)record(index+1);},500));
  }
 }
 addEventListener('message',event=>{
  if(event.origin!==location.origin||!event.data||event.data.channel!=='birthday-journey')return;
  const entry=[...records].find(([,item])=>item.frame.contentWindow===event.source);if(!entry)return;
  const [index,item]=entry;
  if(event.data.type==='loaded'){item.resolveLoaded();return;}
  if(event.data.type==='next'){if(index===current&&item.ready&&!item.modal&&pendingIndex===null)show(current+1);return;}
  if(event.data.type==='complete'){
   item.ready=true;
   if(index===0&&current===0&&!item.advanced){item.advanced=true;show(1);return;}
  }else if(event.data.type==='modal')item.modal=Boolean(event.data.open);
  else if(event.data.type==='departed'&&index===current&&departing){departing=false;person=event.data.person;show(current+1);return;}
  if(index===current)navigationState();
 });

   departing=true;previous.disabled=next.disabled=true;
   records.get(current).frame.contentWindow.postMessage({type:'journey:depart'},location.origin);return;
  }
  if(current===scenes.length-1){const opening=records.get(0);opening?.frame.remove();records.delete(0);show(0);}
  else show(current+1);
 });
 show(0);
})();

 const copy=new Map(Object.entries(window.BIRTHDAY_THAI||{}).map(([k,v])=>[normalize(k),v]));
 function translation(text){
  const key=normalize(text);if(copy.has(key))return copy.get(key);
  let m;
  if((m=key.match(/^第([123])格·放入照片$/)))return `ช่องที่ ${m[1]} · เพิ่มรูป`;
  if((m=key.match(/^已放入([123])张照片·点击可更换$/)))return `เพิ่มรูปแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已经放入([123])张见面照片·点击相纸可更换$/)))return `เพิ่มรูปที่ได้เจอกันแล้ว ${m[1]} รูป · แตะเพื่อเปลี่ยน`;
  if((m=key.match(/^已刮开([0-3])\/3栏$/)))return `ขูดแล้ว ${m[1]} / 3 ช่อง`;
  if((m=key.match(/^([123])个爱心停好了。$/)))return `หัวใจหยุดแล้ว ${m[1]} ดวง`;
  if((m=key.match(/^已贴好([1-4])片，继续拼下一片。$/)))return `ติดแล้ว ${m[1]} ชิ้น ต่อชิ้นถัดไปได้เลย`;
  if((m=key.match(/^刮开第([123])栏$/)))return `ขูดช่องที่ ${m[1]}`;
  if((m=key.match(/^第([123])栏已刮开$/)))return `ขูดช่องที่ ${m[1]} แล้ว`;
  if((m=key.match(/^为第([123])格选择照片$/)))return `เลือกรูปสำหรับช่องที่ ${m[1]}`;
  if((m=key.match(/^为曼谷回忆选择第([123])张照片$/)))return `เลือกรูปความทรงจำกรุงเทพฯ ใบที่ ${m[1]}`;
  if((m=key.match(/^拼上第[一二三四五]层[紫红黄绿粉]色祝福纸条$/)))return 'ต่อกระดาษคำอวยพรชั้นนี้';
  return null;
 }
 const ignored='script,style,noscript,textarea,option,title,svg,.bi-zh,.bi-th,[data-no-translate]';
 function spans(text,thai){const zh=document.createElement('span'),th=document.createElement('span');zh.className='bi-zh';zh.lang='zh-CN';zh.textContent=text;th.className='bi-th';th.lang='th';th.textContent=thai;return [zh,th];}
 function translateElement(el){
  for(const attr of ['aria-label','title']){const value=el.getAttribute(attr);if(value&&!/[\u0e00-\u0e7f]/.test(value)){const thai=translation(value);if(thai)el.setAttribute(attr,value+' · '+thai);}}
  if(el.closest(ignored))return;
  // Only group text and line breaks: keep controls, images and event handlers intact.
  if(el.childNodes.length&&[...el.childNodes].every(n=>n.nodeType===3||n.nodeName==='BR')){
   const text=el.textContent,thai=cn.test(text)&&translation(text);
   if(thai){const pair=spans(text,thai);pair[0].replaceChildren(...el.childNodes);el.classList.add('bi');el.replaceChildren(...pair);return;}
  }
  for(const node of [...el.childNodes]){
   if(node.nodeType!==3||!cn.test(node.textContent))continue;
   const thai=translation(node.textContent);if(!thai)continue;
   const pair=document.createElement('span');pair.className='bi bi-inline';pair.append(...spans(node.textContent,thai));node.replaceWith(pair);
  }
 }
 function scan(root){
  if(!root)return;
  if(root.nodeType===3){root=root.parentElement;}
  if(!root||root.nodeType!==1||root.closest(ignored))return;
  // Work from leaves upward so unrelated text never becomes one translation.
  [...root.querySelectorAll('*')].reverse().forEach(translateElement);translateElement(root);
 }
 scan(document.body);
 const observer=new MutationObserver(records=>{
  const roots=new Set();for(const r of records){if(r.type==='attributes')roots.add(r.target);else if(r.type==='characterData')roots.add(r.target.parentElement);else {roots.add(r.target);}}
  observer.disconnect();for(const root of roots)scan(root);observe();
 });
 function observe(){if(!document.body)return;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title']});}observe();
 // SVG labels need SVG text rather than HTML spans, and their own clear second line.
 for(const el of document.querySelectorAll('svg text')){
  const thai=translation(el.textContent);if(!thai)continue;
  const line=document.createElementNS('http://www.w3.org/2000/svg','tspan');line.setAttribute('x',el.getAttribute('x')||'0');line.setAttribute('dy','13');line.setAttribute('class','svg-th');line.setAttribute('lang','th');line.textContent=thai;el.append(line);
 }
 document.documentElement.classList.add('bilingual');
})();
</script></body></html>
